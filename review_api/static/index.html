<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autofill Review Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#F4F3EE; --card:#FFFFFF; --ink:#14213D; --ink-soft:#3E4A63; --muted:#6B7488; --rule:#DAD6CC;
  --accent:#B85C1E; --field:#FFFFFF; --chip:#EEF1F6;
  --critical:#d03b3b; --high:#ec835a; --medium:#fab219; --low:#898781;
  --critical-tint:#FBE7E7; --high-tint:#FDEDE6; --medium-tint:#FEF4DE; --low-tint:#EEEDEA;
  --sans:'IBM Plex Sans','Segoe UI',Arial,sans-serif; --mono:'IBM Plex Mono',Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1626; --card:#172239; --ink:#EEF1F6; --ink-soft:#C3CBDA; --muted:#8F9AB0; --rule:#2B3A5A;
    --accent:#F0A263; --field:#10192C; --chip:#22314F;
    --critical-tint:#3A1D22; --high-tint:#3A2620; --medium-tint:#3A3020; --low-tint:#262B36;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1626; --card:#172239; --ink:#EEF1F6; --ink-soft:#C3CBDA; --muted:#8F9AB0; --rule:#2B3A5A;
  --accent:#F0A263; --field:#10192C; --chip:#22314F;
  --critical-tint:#3A1D22; --high-tint:#3A2620; --medium-tint:#3A3020; --low-tint:#262B36;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.5}
header{display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; padding:14px 20px; border-bottom:1px solid var(--rule); background:var(--card)}
header h1{font-size:18px; margin:0; font-weight:600}
header .sub{color:var(--muted); font-size:13px}
.spacer{flex:1}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:3px 10px; border-radius:99px; background:var(--chip); color:var(--ink-soft)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--low)}
.dot.ok{background:#0ca30c} .dot.bad{background:var(--critical)}
main{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:20px; padding:20px; align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:12px}
.panel h2{font-size:15px; margin:0}
label{display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:500; color:var(--ink-soft)}
input,select,textarea{font:inherit; font-size:14px; color:var(--ink); background:var(--field); border:1px solid var(--rule); border-radius:6px; padding:7px 9px; width:100%}
textarea{min-height:96px; resize:vertical}
.row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
button{font:inherit; font-size:13px; font-weight:500; border-radius:6px; padding:7px 12px; cursor:pointer; border:1px solid var(--rule); background:var(--card); color:var(--ink)}
button.primary{background:var(--ink); color:var(--paper); border-color:var(--ink)}
button:disabled{opacity:.55; cursor:progress}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.actions{display:flex; flex-wrap:wrap; gap:8px}
.msg{font-size:13px; min-height:1.5em; color:var(--ink-soft)}
.msg.err{color:var(--critical)}
.feed{display:flex; flex-direction:column; gap:6px; max-height:260px; overflow:auto}
.note{font-size:12px; padding:6px 8px; border-radius:6px; background:var(--paper); border-left:3px solid var(--low)}
.note time{font-family:var(--mono); color:var(--muted); margin-right:6px}
.board{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
@media (max-width:1300px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.board{grid-template-columns:1fr}}
.col{display:flex; flex-direction:column; gap:10px; min-width:0}
.colhead{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; font-weight:600}
.colhead .count{margin-left:auto; font-family:var(--mono); font-size:13px}
.colhead .hint{font-weight:400; font-size:12px; color:var(--ink-soft)}
.icon{width:18px; height:18px; flex:none}
.empty{font-size:13px; color:var(--muted); padding:6px 10px}
.card{background:var(--card); border:1px solid var(--rule); border-left:4px solid var(--low); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px}
.card.critical{border-left-color:var(--critical)} .card.high{border-left-color:var(--high)} .card.medium{border-left-color:var(--medium)}
.card.resolved{opacity:.6}
.meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color:var(--muted)}
.meta .id{font-family:var(--mono)}
.chip{font-size:11px; font-weight:600; padding:1px 8px; border-radius:99px; background:var(--chip); color:var(--ink-soft)}
.chip.conflict{background:var(--medium-tint); color:var(--ink)}
.where{font-size:12px; color:var(--ink-soft)}
.summary{font-weight:600}
.kv{font-size:13px} .kv b{color:var(--ink-soft); font-weight:600}
details{font-size:12px; color:var(--ink-soft)}
details p{margin:4px 0 0}
.toasts{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:8px; max-width:min(380px, calc(100vw - 32px)); z-index:5}
.toast{background:var(--ink); color:var(--paper); padding:10px 14px; border-radius:8px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.25); border-left:4px solid var(--high)}
.toast.critical{border-left-color:var(--critical)}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .2s ease-out}@keyframes in{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Autofill Review Desk</h1>
    <div class="sub">Customer comments on filled forms, triaged by Claude and sorted by priority for the form editor.</div>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="health"><span class="dot"></span><span>Checking API…</span></span>
  <label id="keywrap" hidden style="flex-direction:row; align-items:center; gap:6px">Access key
    <input id="accesskey" type="password" autocomplete="off" style="width:160px">
  </label>
</header>

<main>
  <div style="display:flex; flex-direction:column; gap:20px">
    <form class="panel" id="form">
      <h2>New customer comment</h2>
      <label for="example">Load an example from the case
        <select id="example"><option value="">Choose an example…</option></select>
      </label>
      <div class="row">
        <label for="customer">Customer<input id="customer" maxlength="120" placeholder="Customer 87"></label>
        <label for="state">State<input id="state" maxlength="60" placeholder="Texas"></label>
      </div>
      <div class="row">
        <label for="formname">Form<input id="formname" maxlength="120" placeholder="TX title application"></label>
        <label for="field">Field<input id="field" maxlength="120" placeholder="Box 12"></label>
      </div>
      <div class="row">
        <label for="transaction">Transaction ID<input id="transaction" maxlength="60" placeholder="TX-10442"></label>
        <label for="submitter">Submitted by<input id="submitter" maxlength="120" placeholder="Title clerk"></label>
      </div>
      <label for="comment">Comment<textarea id="comment" maxlength="2000" required placeholder="What's wrong with the filled form?"></textarea></label>
      <div class="actions">
        <button class="primary" type="submit" id="submit">Triage comment</button>
        <button type="button" id="runall">Run all 7 examples</button>
      </div>
      <div class="msg" id="msg" role="status"></div>
    </form>

    <section class="panel">
      <h2>Editor notifications</h2>
      <div class="feed" id="feed"><div class="empty">No notifications yet.</div></div>
      <div class="actions">
        <label style="flex-direction:row; align-items:center; gap:6px; font-weight:400"><input type="checkbox" id="showresolved" style="width:auto"> Show resolved</label>
        <div class="spacer"></div>
        <button type="button" id="clear">Clear demo data</button>
      </div>
    </section>
  </div>

  <section class="board" id="board" aria-label="Tickets by priority"></section>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const PRIORITIES = [
  {key:"critical", label:"Critical", hint:"Every filing at risk", icon:'<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5 19 18H1z" fill="var(--critical)"/><path d="M10 7v5M10 14.2v1" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>'},
  {key:"high", label:"High", hint:"Wrong data on the form", icon:'<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--high)"/><path d="M10 5v6M10 13.8v1" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>'},
  {key:"medium", label:"Medium", hint:"Decide before changing", icon:'<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="1.5" y="1.5" width="17" height="17" rx="4" fill="var(--medium)"/><path d="M6 10h8" stroke="#14213D" stroke-width="2" stroke-linecap="round"/></svg>'},
  {key:"low", label:"Low", hint:"Cosmetic or questions", icon:'<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--low)"/><path d="M6.5 10.2l2.3 2.3 4.7-5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'},
];
const CATEGORY = {mapping_error:"Mapping error", condition_rule_error:"Fill rule error", customer_preference:"Customer preference",
  extraction_error:"Extraction error", form_version:"Form version", conflicting_feedback:"Conflicting feedback",
  unclear:"Unclear", not_an_error:"Not an error"};
const ROUTE = {form_editor:"Form editor", extraction_team:"Extraction team", forms_team:"Forms team", account_owner:"Account owner"};
const SCOPE = {all_customers:"All customers", this_customer_only:"This customer only", needs_verification:"Verify first"};

const EXAMPLES = [
  {customer:"Customer 87", state:"Texas", form:"TX title application", field:"Box 12", transaction_id:"TX-10442", submitted_by:"Title clerk",
   comment:"Box 12 should have the lessor's name, not the lessee's."},
  {customer:"Customer 110", state:"Texas", form:"TX title application", field:"Odometer reading", transaction_id:"TX-10518", submitted_by:"Title clerk",
   comment:"We never fill in the odometer reading on brand-new vehicles. Please leave it blank."},
  {customer:"Customer 87", state:"Alabama", form:"AL title application", field:"VIN (page 2)", transaction_id:"AL-2291", submitted_by:"Title clerk",
   comment:"The VIN on page 2 is wrong. It has an O where it should be a 0."},
  {customer:"Customer 121", state:"Florida", form:"FL title application", field:"Whole form", transaction_id:"FL-7730", submitted_by:"Office manager",
   comment:"This is the old version of the form. The DMV switched to the new one last month."},
  {customer:"Customer 87", state:"Georgia", form:"GA title application", field:"Purchase price", transaction_id:"GA-3310", submitted_by:"Clerk A",
   comment:"The purchase price should include the dealer fees."},
  {customer:"Customer 87", state:"Georgia", form:"GA title application", field:"Purchase price", transaction_id:"GA-3318", submitted_by:"Clerk B",
   comment:"The purchase price should not include the dealer fees. Fees are listed separately."},
  {customer:"Customer 87", state:"Arizona", form:"AZ title application", field:"Lienholder section", transaction_id:"AZ-5521", submitted_by:"Title clerk",
   comment:"Why is the lienholder section filled in? This vehicle was paid in cash."},
];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lastSeq = 0, firstLoad = true;

function accessKey(){ try { return sessionStorage.getItem("accessKey") || ""; } catch { return ""; } }
$("accesskey").addEventListener("input", e => { try { sessionStorage.setItem("accessKey", e.target.value); } catch {} });
$("accesskey").value = accessKey();

async function api(path, opts = {}){
  const headers = {"Content-Type":"application/json"};
  if (accessKey()) headers["X-Access-Key"] = accessKey();
  const res = await fetch(path, {...opts, headers});
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function setMsg(text, isErr){ const m = $("msg"); m.textContent = text; m.className = "msg" + (isErr ? " err" : ""); }

EXAMPLES.forEach((ex, i) => $("example").insertAdjacentHTML("beforeend",
  `<option value="${i}">${i+1}. ${esc(ex.comment.slice(0, 48))}${ex.comment.length > 48 ? "…" : ""}</option>`));
$("example").addEventListener("change", e => {
  const ex = EXAMPLES[e.target.value]; if (!ex) return;
  $("customer").value = ex.customer; $("state").value = ex.state; $("formname").value = ex.form; $("field").value = ex.field;
  $("transaction").value = ex.transaction_id; $("submitter").value = ex.submitted_by; $("comment").value = ex.comment;
});

function payloadFromForm(){
  return {customer:$("customer").value, state:$("state").value, form:$("formname").value, field:$("field").value,
          transaction_id:$("transaction").value, submitted_by:$("submitter").value, comment:$("comment").value};
}

async function submit(payload){
  const t = await api("/api/feedback", {method:"POST", body:JSON.stringify(payload)});
  await refresh();
  return t;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const payload = payloadFromForm();
  if (!payload.comment.trim()){ setMsg("Write a comment first.", true); return; }
  $("submit").disabled = true; setMsg("Claude is reading the comment…");
  try {
    const t = await submit(payload);
    setMsg(`${t.id} filed as ${t.priority.toUpperCase()} · ${CATEGORY[t.category] || t.category}.`);
    $("comment").value = ""; $("example").value = "";
  } catch (err) { setMsg(err.message, true); }
  finally { $("submit").disabled = false; }
});

$("runall").addEventListener("click", async () => {
  $("runall").disabled = true; $("submit").disabled = true;
  try {
    for (let i = 0; i < EXAMPLES.length; i++){
      setMsg(`Triaging example ${i+1} of ${EXAMPLES.length}…`);
      await submit(EXAMPLES[i]);
    }
    setMsg(`All ${EXAMPLES.length} examples triaged.`);
  } catch (err) { setMsg(err.message, true); }
  finally { $("runall").disabled = false; $("submit").disabled = false; }
});

$("clear").addEventListener("click", async () => {
  const b = $("clear");
  if (b.dataset.confirm !== "1"){ b.dataset.confirm = "1"; b.textContent = "Click again to clear"; setTimeout(() => { b.dataset.confirm = ""; b.textContent = "Clear demo data"; }, 3000); return; }
  b.dataset.confirm = ""; b.textContent = "Clear demo data";
  try { await api("/api/tickets", {method:"DELETE"}); lastSeq = 0; $("feed").innerHTML = '<div class="empty">No notifications yet.</div>'; await refresh(); setMsg("Demo data cleared."); }
  catch (err) { setMsg(err.message, true); }
});
$("showresolved").addEventListener("change", refresh);

function card(t){
  const tr = t.triage, where = [t.state, t.form, tr.affected_field].filter(Boolean).map(esc).join(" · ");
  const conflicts = (tr.conflicts_with || []).length ? `<span class="chip conflict">Conflicts with ${tr.conflicts_with.map(esc).join(", ")}</span>` : "";
  const buttons = t.status === "resolved" ? `<button data-id="${esc(t.id)}" data-status="open">Reopen</button>`
    : (t.status === "open" ? `<button data-id="${esc(t.id)}" data-status="acknowledged">Acknowledge</button>` : "") +
      `<button data-id="${esc(t.id)}" data-status="resolved">Resolve</button>`;
  return `<article class="card ${esc(t.priority)} ${t.status === "resolved" ? "resolved" : ""}">
    <div class="meta"><span class="id">${esc(t.id)}</span><span class="chip">${esc(CATEGORY[tr.category] || tr.category)}</span>
      <span class="chip">→ ${esc(ROUTE[tr.route_to] || tr.route_to)}</span>${conflicts}<span>${esc(t.status)}</span></div>
    <div class="where">${where}${t.customer ? " · " + esc(t.customer) : ""}</div>
    <div class="summary">${esc(tr.error_summary)}</div>
    <div class="kv"><b>Fix:</b> ${esc(tr.suggested_fix)}</div>
    <div class="kv"><b>Check first:</b> ${esc(tr.verification_step)}</div>
    <div class="meta"><span>Scope: ${esc(SCOPE[tr.scope] || tr.scope)}</span><span>· Mapping change: ${tr.requires_mapping_change ? "yes" : "no"}</span><span>· Confidence: ${esc(tr.confidence)}</span></div>
    <details><summary>Customer comment and reasoning</summary>
      <p>“${esc(t.comment)}”${t.submitted_by ? " (" + esc(t.submitted_by) + ")" : ""}</p>
      <p><b>Intent:</b> ${esc(tr.intent)}</p><p><b>Why this priority:</b> ${esc(tr.priority_reason)}</p></details>
    <div class="actions">${buttons}</div>
  </article>`;
}

async function refresh(){
  try {
    const q = await api("/api/queue" + ($("showresolved").checked ? "?include_resolved=true" : ""));
    $("board").innerHTML = PRIORITIES.map(p => {
      const items = q.groups[p.key] || [];
      return `<div class="col"><div class="colhead" style="background:var(--${p.key}-tint)">${p.icon}<span>${p.label}</span>
        <span class="hint">${p.hint}</span><span class="count">${items.length}</span></div>
        ${items.length ? items.map(card).join("") : '<div class="empty">Nothing here.</div>'}</div>`;
    }).join("");
    const notes = await api(`/api/notifications?since=${lastSeq}`);
    if (notes.length){
      const feed = $("feed"); if (lastSeq === 0) feed.innerHTML = "";
      notes.slice().reverse().forEach(n => {
        feed.insertAdjacentHTML("afterbegin", `<div class="note" style="border-left-color:var(--${esc(n.priority)})"><time>${esc(n.created_at.slice(11,19))}</time>${esc(n.message)}</div>`);
        if (!firstLoad && (n.priority === "critical" || n.priority === "high")) toast(n);
      });
      lastSeq = Math.max(lastSeq, ...notes.map(n => n.seq));
    }
    firstLoad = false;
  } catch (err) { setMsg(err.message, true); }
}

function toast(n){
  const el = document.createElement("div");
  el.className = "toast " + n.priority; el.textContent = n.message;
  $("toasts").appendChild(el); setTimeout(() => el.remove(), 7000);
}

$("board").addEventListener("click", async e => {
  const b = e.target.closest("button[data-id]"); if (!b) return;
  b.disabled = true;
  try { await api(`/api/tickets/${encodeURIComponent(b.dataset.id)}`, {method:"PATCH", body:JSON.stringify({status:b.dataset.status})}); await refresh(); }
  catch (err) { setMsg(err.message, true); b.disabled = false; }
});

(async function init(){
  try {
    const h = await api("/api/health");
    $("health").innerHTML = h.classifier_ready
      ? `<span class="dot ok"></span><span>Claude ready · ${esc(h.model)}</span>`
      : `<span class="dot bad"></span><span>No API key on the server</span>`;
    $("keywrap").hidden = !h.access_key_required;
  } catch { $("health").innerHTML = '<span class="dot bad"></span><span>API unreachable</span>'; }
  await refresh();
  setInterval(refresh, 6000);
})();
</script>
</body>
</html>
